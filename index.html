<!DOCTYPE html>
<!--
  涂装行业 MES 系统原型（HTML/CSS/JS 分离版）
  文件结构：
    index.html  页面结构（本文件）
    style.css   全部样式
    data.js     模拟数据配置
    app.js      应用逻辑
  说明：
    1. 全部为模拟静态写死数据，无后端依赖；
    2. ECharts 通过 jsDelivr CDN 引入（联网可用）；
    3. 打开页面先显示登录页（账号密码已预填 zty33232），点击登录进入系统。
-->
<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>涂装MES系统 - 原型</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ============ 登录页（左右分栏：左品牌展示 / 右登录表单；页面打开时显示，MES 主界面隐藏） ============ -->
    <div id="loginMask">
        <div class="login-shell">
            <!-- 左侧品牌展示区 -->
            <div class="login-brand">
                <div class="brand-logo">🏭</div>
                <div class="brand-name">涂装MES系统</div>
                <div class="brand-slogan">涂装行业数字化车间管理平台</div>
                <ul class="brand-features">
                    <li><span class="feat-icon">📦</span>专注涂装工艺</li>
                    <li><span class="feat-icon">📊</span>设备订单管理</li>
                    <li><span class="feat-icon">🔬</span>聚焦人机料法环测</li>
                    <li><span class="feat-icon">🛠️</span>适配喷粉电泳线</li>
                </ul>
                <div class="brand-footer"> MES · 智能制造</div>
            </div>
            <!-- 右侧登录表单区 -->
            <div class="login-form-side">
                <div class="login-form-inner">
                    <div class="login-title">欢迎登录</div>
                    <div class="login-subtitle">请输入账号信息进入系统</div>
                    <div class="login-field">
                        <label>用户名</label>
                        <input type="text" class="login-input" id="loginUser" value="zty33232" placeholder="请输入用户名" onkeydown="if(event.key==='Enter')doLogin()">
                    </div>
                    <div class="login-field">
                        <label>密码</label>
                        <input type="password" class="login-input" id="loginPwd" value="zty33232" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
                    </div>
                    <button type="button" class="login-btn" onclick="doLogin()">登 录</button>
                    <div class="login-hint">演示系统，账号密码已预填，直接点登录</div>
                </div>
            </div>
        </div>
    </div>

    <div id="app" style="display:none;">
        <!-- 左侧导航栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <span class="logo-text">涂装MES系统</span>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- 导航菜单由JS动态生成 -->
            </nav>
        </aside>

        <!-- 主内容区 -->
        <div class="main-wrapper">
            <!-- 顶部栏 -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
                    <span class="page-title" id="pageTitle">首页</span>
                </div>
                <div class="topbar-right">
                    <span class="notification-icon" title="消息通知">🔔 <span class="badge">3</span></span>
                    <span class="welcome-text">欢迎，管理员</span>
                    <button class="btn-text" onclick="showChangePassword()">修改密码</button>
                    <button class="btn-text btn-logout" onclick="logout()">退出登录</button>
                </div>
            </header>

            <!-- 顶部模块Tab标签栏（面包屑导航下方、仪表盘上方，由JS动态生成） -->
            <div class="module-tabs" id="moduleTabs"></div>

            <!-- 内容区域 -->
            <main class="content" id="content">
                <!-- 页面内容由JS动态生成 -->
            </main>
        </div>
    </div>

    <!-- 弹窗容器 -->
    <div id="modalContainer"></div>

    <!-- ECharts（CDN 引入） -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>

    <!-- 数据配置（外链） -->
    <script src="data.js"></script>

    <!-- 应用逻辑（外链） -->
    <script src="app.js"></script>
</body></html>
