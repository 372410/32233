<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#334155">
    <title>涂装MES · 移动端</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= 登录页（QQ 风格） ================= -->
    <div id="loginView" class="login-view">
        <div class="login-brand">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 20h20"/><path d="M4 20V9l6 4V9l6 4V6l6-3v17"/>
                </svg>
            </div>
            <h1 class="login-title">涂装MES</h1>
            <p class="login-subtitle">涂装制造执行系统 · 移动端</p>
        </div>

        <form id="loginForm" class="login-form" novalidate>
            <div class="login-inputs">
                <div class="login-field">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="loginUser" value="zhangsan" placeholder="请输入账号" autocomplete="username" maxlength="20">
                </div>
                <div class="login-divider"></div>
                <div class="login-field">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="loginPwd" value="123456" placeholder="请输入密码" autocomplete="current-password" maxlength="20">
                    <button type="button" class="pwd-toggle" id="togglePwd" aria-label="显示或隐藏密码">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <p class="login-error" id="loginError"></p>

            <button type="submit" class="login-btn" id="loginBtn">登 录</button>

            <div class="login-links">
                <label class="remember">
                    <input type="checkbox" id="rememberPwd" checked>
                    <span>记住密码</span>
                </label>
                <a href="javascript:void(0)" class="link-muted">忘记密码？</a>
            </div>
        </form>

        <p class="login-footer">涂装车间数字化管理平台 · v1.0</p>
    </div>

    <!-- ================= 主应用 ================= -->
    <div id="appView" class="app-view hidden">

        <!-- Tab 1：首页看板 -->
        <section class="page active" id="page-home">
            <header class="home-header">
                <div class="home-header-top">
                    <div>
                        <h2 class="home-title">涂装MES</h2>
                        <p class="home-date" id="homeDate"></p>
                    </div>
                    <div class="home-user">
                        <span class="home-user-name" id="homeUserName">--</span>
                        <span class="avatar" id="homeAvatar">--</span>
                    </div>
                </div>
            </header>

            <div class="page-body">
                <div class="stats-grid" id="statsGrid"></div>

                <div class="section-head">
                    <h3 class="section-title">待处理工单</h3>
                    <span class="section-count" id="pendingCount">0 单</span>
                </div>
                <div class="order-mini-list" id="pendingList"></div>
            </div>
        </section>

        <!-- Tab 2：质量检查 -->
        <section class="page" id="page-qc">
            <header class="page-header">
                <h2 class="page-header-title">质量检查</h2>
                <span class="page-header-sub" id="qcSummary">--</span>
            </header>

            <div class="filter-bar" id="qcFilter">
                <button class="filter-btn active" data-qc="来料检">来料检</button>
                <button class="filter-btn" data-qc="出货检">出货检</button>
                <button class="filter-btn" data-qc="过程检">过程检</button>
                <button class="filter-btn" data-qc="成品入库检">成品入库检</button>
            </div>

            <div class="page-body">
                <div class="qc-list" id="qcList"></div>
            </div>
        </section>

        <!-- Tab 3：工作台 -->
        <section class="page" id="page-bench">
            <header class="page-header">
                <h2 class="page-header-title">工作台</h2>
                <span class="page-header-sub" id="benchUser">--</span>
            </header>

            <div class="page-body">
                <div id="benchGrid"></div>
            </div>
        </section>

        <!-- Tab 4：我的 -->
        <section class="page" id="page-profile">
            <header class="profile-header">
                <span class="avatar avatar-lg" id="profileAvatar">--</span>
                <div class="profile-id">
                    <h2 class="profile-name" id="profileName">--</h2>
                    <p class="profile-dept" id="profileDept">--</p>
                </div>
            </header>

            <div class="page-body">
                <div class="info-card">
                    <div class="info-row">
                        <span class="info-label">岗位</span>
                        <span class="info-value" id="infoRole">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">班组</span>
                        <span class="info-value" id="infoTeam">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">当日报工数</span>
                        <span class="info-value info-accent" id="infoReport">--</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">联系电话</span>
                        <span class="info-value" id="infoPhone">--</span>
                    </div>
                </div>

                <div class="section-head">
                    <h3 class="section-title">我的报工记录</h3>
                    <span class="section-count" id="myReportCount">0 条</span>
                </div>
                <div class="report-list" id="myReportList"></div>

                <button class="logout-btn" id="logoutBtn">退出登录</button>
            </div>
        </section>

        <!-- 子页：我的通知 -->
        <section class="subpage" id="page-notice">
            <header class="subpage-header">
                <button class="back-btn" data-back="1" aria-label="返回">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <h2 class="subpage-title">我的通知</h2>
                <span class="subpage-spacer"></span>
            </header>
            <div class="subpage-body" id="noticeBody"></div>
        </section>

        <!-- 子页：设置 -->
        <section class="subpage" id="page-settings">
            <header class="subpage-header">
                <button class="back-btn" data-back="1" aria-label="返回">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <h2 class="subpage-title">设置</h2>
                <span class="subpage-spacer"></span>
            </header>
            <div class="subpage-body" id="settingsBody"></div>
        </section>

        <!-- 子页：工单详情 -->
        <section class="subpage" id="page-order-detail">
            <header class="subpage-header">
                <button class="back-btn" data-back="1" aria-label="返回">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <h2 class="subpage-title">工单详情</h2>
                <span class="subpage-spacer"></span>
            </header>
            <div class="subpage-body" id="orderDetailBody"></div>
            <div class="subpage-footer">
                <button class="primary-btn" id="orderReportBtn">报 工</button>
            </div>
        </section>

        <!-- 子页：质检报告 -->
        <section class="subpage" id="page-qc-detail">
            <header class="subpage-header">
                <button class="back-btn" data-back="1" aria-label="返回">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <h2 class="subpage-title">质检报告</h2>
                <span class="subpage-spacer"></span>
            </header>
            <div class="subpage-body" id="qcDetailBody"></div>
        </section>

        <!-- 子页：报工表单 -->
        <section class="subpage" id="page-report-form">
            <header class="subpage-header">
                <button class="back-btn" data-back="1" aria-label="返回">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <h2 class="subpage-title">扫码报工</h2>
                <span class="subpage-spacer"></span>
            </header>
            <div class="subpage-body" id="reportFormBody"></div>
            <div class="subpage-footer">
                <button class="primary-btn" id="reportSubmitBtn">提交报工</button>
            </div>
        </section>

        <!-- 底部导航（5 槽位，中央 + 号） -->
        <nav class="tabbar">
            <button class="tab-item active" data-page="page-home">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/>
                </svg>
                <span class="tab-label">首页看板</span>
            </button>
            <button class="tab-item" data-page="page-qc">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M8 11l2 2 4-4"/>
                </svg>
                <span class="tab-label">质量检查</span>
            </button>
            <button class="tab-item tab-center" id="scanBtn" aria-label="扫码报工">
                <span class="tab-plus">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                </span>
                <span class="tab-label">扫码报工</span>
            </button>
            <button class="tab-item" data-page="page-bench">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
                </svg>
                <span class="tab-label">工作台</span>
            </button>
            <button class="tab-item" data-page="page-profile">
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="tab-label">我的</span>
            </button>
        </nav>
    </div>

    <!-- 扫码报工弹窗 -->
    <div class="modal-mask hidden" id="scanModal">
        <div class="modal">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8"/><path d="M11 8v8"/><path d="M15 8v5"/><path d="M18 8v8"/>
                </svg>
            </div>
            <h3 class="modal-title">扫码报工</h3>
            <p class="modal-desc">扫描工单条码，快速定位工单并提交报工</p>
            <div class="modal-actions">
                <button class="modal-btn ghost" data-close="1">取消</button>
                <button class="modal-btn solid" id="scanGoBtn">开始扫码报工</button>
            </div>
        </div>
    </div>

    <!-- 权限不足弹窗 -->
    <div class="modal-mask hidden" id="denyModal">
        <div class="modal">
            <div class="modal-icon deny">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v2.5"/>
                </svg>
            </div>
            <h3 class="modal-title">权限不足</h3>
            <p class="modal-desc">您暂无该模块的访问权限<br>请联系计划部更改权限</p>
            <div class="modal-actions">
                <button class="modal-btn solid" data-close="1">知道了</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>

    <!-- 业务数据：全部来自项目根目录 data.js，移动端代码不定义任何业务数据 -->
    <script src="../data.js"></script>
    <script src="app.js"></script>
</body>
</html>
